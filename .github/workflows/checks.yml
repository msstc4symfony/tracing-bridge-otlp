name: Code Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v3.3.0
    with:
      slug: msstc4symfony/tracing-bridge-otlp
      # Measured MSI 98 % / covered 98 % on 2026-10-25 UTC (3 equivalent mutants), minus a margin for noise.
      infection-min-msi: 95
      infection-min-covered-msi: 95
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
